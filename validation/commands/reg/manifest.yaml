{
  "schema_version": 1,
  "specification_version": "2.0.1",
  "command": "reg",
  "public_api": "TabraData.est.reg(y, x, is_con=True)",
  "implementation": "src/tabra/models/estimate/ols.py::OLS.fit",
  "stage": "pilot",
  "engines": ["python", "stata", "r"],
  "tolerances_frozen": true,
  "engine_runners": {
    "python": "python/run.py",
    "stata": "stata/run.py",
    "r": "r/run.py"
  },
  "environment_requirements": {
    "python": {"minimum_version": "3.11"},
    "stata": {"minimum_version": "16"},
    "r": {"locked_version": "4.4.1", "lockfile": "r/renv.lock"}
  },
  "supported_cases": ["basic", "no_constant"],
  "required_outputs": {
    "metadata": {
      "engine": {"type": "string", "unit": "identifier"},
      "engine_version": {"type": "string", "unit": "version"},
      "dataset_path": {"type": "string", "unit": "repository-relative path"},
      "dataset_sha256": {"type": "string", "unit": "lowercase hexadecimal"},
      "case_status": {"type": "object", "unit": "case counts"}
    },
    "case": {
      "case_id": {"type": "string", "unit": "identifier"},
      "status": {"type": "string", "allowed": ["completed"]},
      "converged": {"type": "boolean", "allowed": [true]},
      "n_obs": {"type": "integer", "unit": "observations"},
      "df_model": {"type": "integer", "unit": "degrees of freedom"},
      "df_resid": {"type": "integer", "unit": "degrees of freedom"}
    },
    "parameters": {
      "type": "ordered array",
      "ordering": "requested independent variables followed by _cons only when include_constant is true",
      "fields": {
        "name": {"type": "string", "unit": "identifier"},
        "estimate": {"type": "number", "unit": "dependent-variable units per regressor unit"},
        "std_error": {"type": "number", "unit": "coefficient units"},
        "statistic": {"type": "number", "unit": "t statistic"},
        "p_value": {"type": "number", "unit": "probability"}
      }
    },
    "statistics": {
      "r_squared": {"type": "number", "unit": "proportion"},
      "r_squared_adj": {"type": "number", "unit": "proportion"},
      "f_stat": {"type": "number", "unit": "F statistic"},
      "f_p_value": {"type": "number", "unit": "probability"},
      "ss_residual": {"type": "number", "unit": "squared dependent-variable units"},
      "ss_model": {"type": "number", "unit": "squared dependent-variable units"},
      "ss_total": {"type": "number", "unit": "squared dependent-variable units"},
      "root_mse": {"type": "number", "unit": "dependent-variable units"}
    }
  },
  "estimation_contract": {
    "sample_selection": "complete cases across y and every requested x",
    "missing_values": "drop a row when y or any requested x is missing",
    "constant": "append one fitted constant named _cons only when is_con is true",
    "weights": "unsupported; every case is unweighted",
    "base_category": "not applicable",
    "convergence": "closed-form least squares must complete with a full-rank design and finite outputs",
    "vce": "homoskedastic s^2 (X'X)^-1 with s^2 = RSS / (N-k)",
    "small_sample_correction": "residual variance divisor is N-k",
    "degrees_of_freedom": "df_model=k-c and df_resid=N-k, where c indicates a fitted constant"
  },
  "unsupported_options": [
    {
      "option": "robust",
      "tabra_status": "not_implemented",
      "policy": "must_not_be_marked_passed",
      "reason": "Tabra reg currently exposes only is_con and computes the homoskedastic OLS covariance."
    }
  ],
  "metrics": {
    "case_ids": {"tolerance": {"exact": true}},
    "nobs": {"tolerance": {"exact": true}},
    "df_model": {"tolerance": {"exact": true}},
    "df_resid": {"tolerance": {"exact": true}},
    "parameter_names": {"tolerance": {"exact": true}},
    "coefficients": {"tolerance": {"atol": 1e-10, "rtol": 1e-9}},
    "standard_errors": {"tolerance": {"atol": 1e-10, "rtol": 1e-8}},
    "test_statistics": {"tolerance": {"atol": 1e-9, "rtol": 1e-8}},
    "p_values": {
      "tolerance": {"atol": 1e-10, "rtol": 1e-8},
      "safety": {"reject_zero_mismatch": true}
    },
    "r_squared": {"tolerance": {"atol": 1e-10, "rtol": 1e-8}},
    "r_squared_adj": {"tolerance": {"atol": 1e-10, "rtol": 1e-8}},
    "f_stat": {"tolerance": {"atol": 1e-9, "rtol": 1e-8}},
    "f_p_value": {
      "tolerance": {"atol": 1e-10, "rtol": 1e-8},
      "safety": {"reject_zero_mismatch": true}
    },
    "ss_residual": {"tolerance": {"atol": 1e-10, "rtol": 1e-8}},
    "ss_model": {"tolerance": {"atol": 1e-10, "rtol": 1e-8}},
    "ss_total": {"tolerance": {"atol": 1e-10, "rtol": 1e-8}},
    "root_mse": {"tolerance": {"atol": 1e-10, "rtol": 1e-8}}
  },
  "comparison_policy": [
    "Tolerances are frozen before execution.",
    "A missing required engine is BLOCKED_ENV, never a skip or pass.",
    "A dataset SHA-256 mismatch is a validation failure.",
    "Engine agreement does not override a contradiction with the independent formula oracle."
  ],
  "release_policy": {
    "release_critical_metrics": [
      "case_ids",
      "nobs",
      "df_model",
      "df_resid",
      "parameter_names",
      "coefficients",
      "standard_errors",
      "test_statistics",
      "p_values",
      "r_squared",
      "r_squared_adj",
      "f_stat",
      "f_p_value",
      "ss_residual",
      "ss_model",
      "ss_total",
      "root_mse"
    ],
    "informational_metrics": [],
    "skip_policy": "any skipped, missing, errored, or nonconverged required case blocks release"
  },
  "data": {
    "generator": "data/generate.py",
    "seed": 20260722,
    "rows": 120,
