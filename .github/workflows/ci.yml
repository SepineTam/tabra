name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

      - name: Validate scientific registry structure
        run: >-
          uv run --python ${{ matrix.python-version }} tabra-validate preflight
          --registry validation/registry.yaml

      - name: Run Python scientific-validation leg
        run: >-
          uv run --python ${{ matrix.python-version }} python
          validation/commands/reg/python/run.py
          --data validation/commands/reg/data/reg_fixture.csv
          --output ${{ runner.temp }}/reg-python-result.json
